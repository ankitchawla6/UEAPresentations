document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

n    <div class=\"card\" style=\"padding:32px 36px;display:flex;flex-direction:column;gap:12px;\">\n      <div style=\"font-family:var(--display);font-weight:700;font-size:52px;color:var(--lb);line-height:1;\">03<\u002Fdiv>\n      <strong style=\"font-size:24px;color:var(--db);line-height:1.35;\">Listing Accomplishments Without Reflection<\u002Fstrong>\n      <p style=\"font-size:24px;color:var(--dg);line-height:1.55;flex:1;\">So you won three awards. What did those experiences teach you? Reflection = insight.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"card\" style=\"padding:32px 36px;display:flex;flex-direction:column;gap:12px;\">\n      <div style=\"font-family:var(--display);font-weight:700;font-size:52px;color:var(--lb);line-height:1;\">04<\u002Fdiv>\n      <strong style=\"font-size:24px;color:var(--db);line-height:1.35;\">Ignoring Word Limits<\u002Fstrong>\n      <p style=\"font-size:24px;color:var(--dg);line-height:1.55;flex:1;\">Going over signals poor judgment. Going under signals lack of depth. Aim for <strong>90–100%<\u002Fstrong> of the limit.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"card\" style=\"padding:32px 36px;display:flex;flex-direction:column;gap:12px;\">\n      <div style=\"font-family:var(--display);font-weight:700;font-size:52px;color:var(--lb);line-height:1;\">05<\u002Fdiv>\n      <strong style=\"font-size:24px;color:var(--db);line-height:1.35;\">Missing the 'Why Us' Factor<\u002Fstrong>\n      <p style=\"font-size:24px;color:var(--dg);line-height:1.55;flex:1;\">If your essay could apply to any school, it weakens your case with admissions officers.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"card\" style=\"padding:32px 36px;display:flex;flex-direction:column;gap:12px;border:2px solid var(--cb);\">\n      <div style=\"font-family:var(--display);font-weight:700;font-size:52px;color:var(--cb);line-height:1;\">06<\u002Fdiv>\n      <strong style=\"font-size:24px;color:var(--db);line-height:1.35;\">Not Getting Feedback<\u002Fstrong>\n      <p style=\"font-size:24px;color:var(--dg);line-height:1.55;flex:1;\">Your Cialfo Guide, a trusted teacher, or a peer — get at least <strong>2 sets of eyes<\u002Fstrong> before submitting.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"ftr\">\n    <span>Cialfo Expert Session<\u002Fspan>\n    <span>Application Writing Masterclass<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n\n\n<!-- ═══════════════════════════════════════════════════════════\n     SLIDE 10 · CIALFO GUIDE ADVANTAGE\n═══════════════════════════════════════════════════════════ -->\n<section style=\"background:var(--ow);\" data-label=\"10 Cialfo Guide Advantage\">\n  <div class=\"hdr\">\n    <span class=\"hdr-lbl\">The Cialfo Guide Advantage<\u002Fspan>\n    <div style=\"background:var(--wh);height:108px;padding:0 52px;display:flex;align-items:center;margin-right:-64px;border-radius:0;\"><img src=\"753de274-4e42-4d95-baf6-ab1eeab3f100\" alt=\"Cialfo\" style=\"height:60px;\"><\u002Fdiv>\n  <\u002Fdiv>\n\n  <p style=\"position:absolute;top:106px;left:64px;right:64px;text-align:center;font-size:24px;color:var(--mg);\">How your Cialfo Guide helps you at every step of the writing process<\u002Fp>\n\n  <div style=\"position:absolute;top:165px;left:64px;right:64px;bottom:58px;display:grid;grid-template-columns:repeat(5,1fr);gap:20px;\">\n    <div class=\"card\" style=\"padding:40px 28px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:22px;\">\n      <div class=\"nbadge\" style=\"background:var(--cb);width:72px;height:72px;font-size:30px;\">1<\u002Fdiv>\n      <div><strong style=\"font-family:var(--serif);font-size:24px;color:var(--db);display:block;margin-bottom:10px;\">Discovery Call<\u002Fstrong><p style=\"font-size:24px;color:var(--dg);line-height:1.55;\">Understanding your story, values &amp; dream schools to identify your unique angle<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"card\" style=\"padding:40px 28px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:22px;\">\n      <div class=\"nbadge\" style=\"background:var(--pu);width:72px;height:72px;font-size:30px;\">2<\u002Fdiv>\n      <div><strong style=\"font-family:var(--serif);font-size:24px;color:var(--db);display:block;margin-bottom:10px;\">Brainstorming<\u002Fstrong><p style=\"font-size:24px;color:var(--dg);line-height:1.55;\">Structured prompts and mind-mapping to surface the stories only you can tell<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"card\" style=\"padding:40px 28px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:22px;\">\n      <div class=\"nbadge\" style=\"background:var(--ye);color:var(--db);width:72px;height:72px;font-size:30px;\">3<\u002Fdiv>\n      <div><strong style=\"font-family:var(--serif);font-size:24px;color:var(--db);display:block;margin-bottom:10px;\">First Draft Review<\u002Fstrong><p style=\"font-size:24px;color:var(--dg);line-height:1.55;\">Line-by-line feedback on structure, voice, narrative arc and content gaps<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"card\" style=\"padding:40px 28px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:22px;\">\n      <div class=\"nbadge\" style=\"background:var(--cb);width:72px;height:72px;font-size:30px;\">4<\u002Fdiv>\n      <div><strong style=\"font-family:var(--serif);font-size:24px;color:var(--db);display:block;margin-bottom:10px;\">Iterative Editing<\u002Fstrong><p style=\"font-size:24px;color:var(--dg);line-height:1.55;\">Multiple rounds of revision until every word earns its place in your essay<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:var(--db);border-radius:12px;padding:40px 28px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:22px;\">\n      <div class=\"nbadge\" style=\"background:var(--ye);color:var(--db);width:72px;height:72px;font-size:30px;\">5<\u002Fdiv>\n      <div><strong style=\"font-family:var(--serif);font-size:24px;color:var(--wh);display:block;margin-bottom:10px;\">Final Polish<\u002Fstrong><p style=\"font-size:24px;color:rgba(255,255,255,.65);line-height:1.55;\">Grammar check, formatting, word count compliance and submission readiness<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"ftr\">\n    <span>Cialfo Expert Session<\u002Fspan>\n    <span>Application Writing Masterclass<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n\n\n<!-- ═══════════════════════════════════════════════════════════\n     SLIDE 11 · KEY TAKEAWAYS\n═══════════════════════════════════════════════════════════ -->\n<section style=\"background:var(--db);\" data-label=\"11 Key Takeaways\">\n  <div style=\"position:absolute;left:0;top:0;bottom:0;width:10px;background:var(--ye);\"><\u002Fdiv>\n  <img src=\"340e74e7-2036-45ec-b223-caba40093e60\" style=\"position:absolute;right:-60px;bottom:-80px;width:440px;opacity:.12;pointer-events:none;\" alt=\"\">\n\n  <div style=\"position:absolute;top:52px;left:64px;\">\n    <img src=\"753de274-4e42-4d95-baf6-ab1eeab3f100\" alt=\"Cialfo\" style=\"height:80px;filter:brightness(0) invert(1);\">\n  <\u002Fdiv>\n\n  <div style=\"position:absolute;top:120px;left:64px;right:64px;bottom:60px;display:grid;grid-template-columns:400px 1fr;gap:48px;\">\n    <!-- Left label -->\n    <div style=\"display:flex;flex-direction:column;justify-content:center;gap:16px;\">\n      <div style=\"font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.16em;text-transform:uppercase;color:var(--ye);\">Wrap-Up<\u002Fdiv>\n      <h2 style=\"font-family:var(--serif);font-weight:700;font-size:76px;color:var(--wh);line-height:1.0;\">Key<br>Take­aways<\u002Fh2>\n      <div style=\"width:56px;height:3px;background:var(--cb);border-radius:2px;\"><\u002Fdiv>\n      <p style=\"font-size:24px;color:rgba(255,255,255,.5);line-height:1.55;\">Five principles every Cialfo student should carry into their writing process.<\u002Fp>\n    <\u002Fdiv>\n\n    <!-- Right: 5 takeaways -->\n    <div style=\"display:flex;flex-direction:column;justify-content:center;gap:16px;\">\n      <div style=\"display:flex;gap:20px;align-items:flex-start;padding:18px 24px;background:rgba(255,255,255,.06);border-radius:10px;border-left:4px solid var(--cb);\">\n        <span style=\"font-family:var(--display);font-weight:700;font-size:24px;color:var(--cb);flex-shrink:0;width:22px;\">1<\u002Fspan>\n        <p style=\"font-size:24px;color:rgba(255,255,255,.9);line-height:1.5;\"><strong style=\"color:var(--wh);\">Specificity wins<\u002Fstrong> — Name the professor. Name the program feature. Vague essays are forgettable.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:20px;align-items:flex-start;padding:18px 24px;background:rgba(255,255,255,.06);border-radius:10px;border-left:4px solid var(--pu);\">\n        <span style=\"font-family:var(--display);font-weight:700;font-size:24px;color:var(--pu);flex-shrink:0;width:22px;\">2<\u002Fspan>\n        <p style=\"font-size:24px;color:rgba(255,255,255,.9);line-height:1.5;\"><strong style=\"color:var(--wh);\">One story, deeply<\u002Fstrong> — Depth beats breadth. A single moment explored well outshines a highlight reel.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:20px;align-items:flex-start;padding:18px 24px;background:rgba(255,255,255,.06);border-radius:10px;border-left:4px solid var(--ye);\">\n        <span style=\"font-family:var(--display);font-weight:700;font-size:24px;color:var(--ye);flex-shrink:0;width:22px;\">3<\u002Fspan>\n        <p style=\"font-size:24px;color:rgba(255,255,255,.9);line-height:1.5;\"><strong style=\"color:var(--wh);\">Start early, revise often<\u002Fstrong> — Strong writing is rewriting. Leave time for at least 3 drafts.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:20px;align-items:flex-start;padding:18px 24px;background:rgba(255,255,255,.06);border-radius:10px;border-left:4px solid var(--cb);\">\n        <span style=\"font-family:var(--display);font-weight:700;font-size:24px;color:var(--cb);flex-shrink:0;width:22px;\">4<\u002Fspan>\n        <p style=\"font-size:24px;color:rgba(255,255,255,.9);line-height:1.5;\"><strong style=\"color:var(--wh);\">Know your audience<\u002Fstrong> — SOP ≠ Personal Statement ≠ Essay. Format, tone, and focus differ by destination.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:20px;align-items:flex-start;padding:18px 24px;background:rgba(255,255,255,.06);border-radius:10px;border-left:4px solid var(--ye);\">\n        <span style=\"font-family:var(--display);font-weight:700;font-size:24px;color:var(--ye);flex-shrink:0;width:22px;\">5<\u002Fspan>\n        <p style=\"font-size:24px;color:rgba(255,255,255,.9);line-height:1.5;\"><strong style=\"color:var(--wh);\">Your Guide is your editor<\u002Fstrong> — Use every review session your Cialfo Guide offers — it's your competitive edge.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n\n<!-- ═══════════════════════════════════════════════════════════\n     SLIDE 12 · THANK YOU\n═══════════════════════════════════════════════════════════ -->\n<section style=\"background:var(--db);\" data-label=\"12 Thank You\">\n  <div style=\"position:absolute;left:0;top:0;bottom:0;width:10px;background:var(--cb);\"><\u002Fdiv>\n  <div style=\"position:absolute;right:0;top:0;bottom:0;width:480px;background:rgba(24,134,223,.08);\"><\u002Fdiv>\n  <img src=\"340e74e7-2036-45ec-b223-caba40093e60\" style=\"position:absolute;right:20px;top:-60px;width:500px;opacity:.18;pointer-events:none;\" alt=\"\">\n\n  <!-- Logo -->\n  <div style=\"position:absolute;top:52px;left:64px;\">\n    <img src=\"753de274-4e42-4d95-baf6-ab1eeab3f100\" alt=\"Cialfo\" style=\"height:80px;filter:brightness(0) invert(1);\">\n  <\u002Fdiv>\n\n  <!-- Left: title -->\n  <div style=\"position:absolute;top:0;left:64px;bottom:60px;width:560px;display:flex;flex-direction:column;justify-content:center;gap:16px;\">\n    <div style=\"font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.16em;text-transform:uppercase;color:var(--cb);\">Crafting Winning Applications<\u002Fdiv>\n    <h2 style=\"font-family:var(--serif);font-weight:700;font-size:96px;color:var(--wh);line-height:.95;\">Thank<br>You!<\u002Fh2>\n    <div style=\"width:56px;height:3px;background:var(--ye);border-radius:2px;\"><\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- Right: Next steps -->\n  <div style=\"position:absolute;top:120px;left:660px;right:64px;bottom:80px;display:flex;flex-direction:column;justify-content:center;gap:18px;\">\n    <div style=\"font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.4);margin-bottom:4px;\">Your Next Steps with Cialfo<\u002Fdiv>\n    <div style=\"display:flex;gap:20px;align-items:center;padding:20px 28px;background:rgba(255,255,255,.06);border-radius:10px;\">\n      <div style=\"width:40px;height:40px;border-radius:50%;background:var(--cb);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:24px;color:var(--wh);\">1<\u002Fdiv>\n      <p style=\"font-size:24px;color:rgba(255,255,255,.85);line-height:1.5;\">Schedule your 1:1 essay brainstorm session with your Cialfo Guide<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:20px;align-items:center;padding:20px 28px;background:rgba(255,255,255,.06);border-radius:10px;\">\n      <div style=\"width:40px;height:40px;border-radius:50%;background:var(--pu);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:24px;color:var(--wh);\">2<\u002Fdiv>\n      <p style=\"font-size:24px;color:rgba(255,255,255,.85);line-height:1.5;\">Draft your 'core story' — the narrative thread across all your documents<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:20px;align-items:center;padding:20px 28px;background:rgba(255,255,255,.06);border-radius:10p
